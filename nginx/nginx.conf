upstream django_backend {
    server backend:8000;
}

upstream nextjs_frontend {
    server frontend:3000;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name confirmation.qomunix.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name confirmation.qomunix.com;

    ssl_certificate     /etc/letsencrypt/live/confirmation.qomunix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/confirmation.qomunix.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Django static files
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django media uploads
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django REST API + admin
    location ~ ^/(api|admin|auth)/ {
        proxy_pass http://django_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
